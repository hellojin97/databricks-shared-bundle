bundle:
  name: "shared_bundle"

include:
  - configuration/*.yml
  - configuration/*.yaml

sync:
  exclude:
    - bundle_config_schema.json
    - github

targets:
  dev:
    default: true
    workspace:
      root_path: ${var.bundle_root_path}
    permissions:
      - group_name: "DATABRICKS_DMP_USER"
        level: CAN_MANAGE