# yaml-language-server: $schema=bundle_config_schema.json
bundle:
  name: "shared_bundle"
  engine: direct

permissions:
  - level: CAN_MANAGE
    service_principal_name: ${var.service_principal}
  - level: CAN_MANAGE
    group_name: ${var.workspace_group}

include:
  - configuration/*.yml
  - configuration/*.yaml

sync:
  exclude:
    - .github
    - .gitignore

targets:
  dev:
    default: true
    workspace:
      root_path: ${var.bundle_root_path}